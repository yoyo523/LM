<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Task 1: finite state machine</title>
  <desc id="desc">A complete DFA over a, b, c, z. It accepts exactly strings starting with a, ending with z, and containing an even number of b symbols. q0 is initial, qF is the only accepting state, and qD is the dead state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#182129" stroke-width="1.3"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #182129; }
      .edge path, .start { fill: none; stroke: #182129; stroke-width: 2.6; marker-end: url(#arrow); }
      .edge text { font-size: 27px; }
      .state { fill: white; stroke: #182129; stroke-width: 3; }
      .name { font-size: 29px; }
    </style>
  </defs>
  <rect width="1100" height="760" fill="white"/>
  <text x="550" y="38" font-size="28">Task 1 - Finite State Machine</text>
  <text x="550" y="70" font-size="20">Starts with a; ends with z; even number of b symbols</text>

  <circle class="state" data-state="q0" data-initial="true" cx="150" cy="360" r="55"/>
  <circle class="state" data-state="qE" cx="440" cy="360" r="55"/>
  <circle class="state" data-state="qO" cx="820" cy="220" r="55"/>
  <circle class="state" data-state="qF" data-accepting="true" cx="820" cy="500" r="55"/>
  <circle class="state" cx="820" cy="500" r="46"/>
  <circle class="state" data-state="qD" cx="150" cy="590" r="55"/>
  <path class="start" d="M 25 360 L 93 360"/>
  <text x="53" y="341" font-size="19">start</text>

  <g class="edge" data-from="q0" data-to="qE" data-symbols="a">
    <path d="M 207 360 L 383 360"/>
    <text x="292" y="341">a</text>
  </g>
  <g class="edge" data-from="q0" data-to="qD" data-symbols="b,c,z">
    <path d="M 150 417 L 150 533"/>
    <text x="213" y="485">b, c, z</text>
  </g>
  <g class="edge" data-from="qE" data-to="qE" data-symbols="a,c">
    <path d="M 405 317 C 335 170 545 170 475 317"/>
    <text x="440" y="198">a, c</text>
  </g>
  <g class="edge" data-from="qE" data-to="qO" data-symbols="b">
    <path d="M 489 334 C 560 222 656 198 764 220"/>
    <text x="618" y="215">b</text>
  </g>
  <g class="edge" data-from="qO" data-to="qE" data-symbols="b">
    <path d="M 782 260 C 690 345 605 384 496 360"/>
    <text x="658" y="385">b</text>
  </g>
  <g class="edge" data-from="qO" data-to="qO" data-symbols="a,c,z">
    <path d="M 785 177 C 710 90 930 90 855 177"/>
    <text x="820" y="102">a, c, z</text>
  </g>
  <g class="edge" data-from="qE" data-to="qF" data-symbols="z">
    <path d="M 491 386 C 570 410 673 456 764 481"/>
    <text x="609" y="421">z</text>
  </g>
  <g class="edge" data-from="qF" data-to="qE" data-symbols="a,c">
    <path d="M 774 532 C 655 635 500 590 442 416"/>
    <text x="590" y="618">a, c</text>
  </g>
  <g class="edge" data-from="qF" data-to="qO" data-symbols="b">
    <path d="M 856 457 C 982 370 982 315 856 263"/>
    <text x="978" y="365">b</text>
  </g>
  <g class="edge" data-from="qF" data-to="qF" data-symbols="z">
    <path d="M 855 543 C 930 667 710 667 785 543"/>
    <text x="820" y="658">z</text>
  </g>
  <g class="edge" data-from="qD" data-to="qD" data-symbols="a,b,c,z">
    <path d="M 115 633 C 40 745 260 745 185 633"/>
    <text x="150" y="740">a, b, c, z</text>
  </g>

  <text class="name" x="150" y="370">q0</text>
  <text class="name" x="440" y="370">qE</text>
  <text class="name" x="820" y="230">qO</text>
  <text class="name" x="820" y="510">qF</text>
  <text class="name" x="150" y="600">qD</text>
  <text x="627" y="726" font-size="20">Alphabet: {a, b, c, z} | Accepting state: qF (double circle)</text>
</svg>
