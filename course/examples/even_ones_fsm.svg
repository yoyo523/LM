<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">DFA accepting binary strings with an even number of ones</title>
  <desc id="desc">The initial state q_even has two circles and is accepting. q_odd has one circle. Zero loops on both states; one changes to the other state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#182129" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1100" height="430" fill="white"/>
  <g fill="#182129" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="550" y="40" font-size="26">DFA: an even number of 1s</text>
    <text x="205" y="222" font-size="20">start</text>
    <text x="360" y="92" font-size="30">0</text>
    <text x="820" y="92" font-size="30">0</text>
    <text x="590" y="140" font-size="30">1</text>
    <text x="590" y="365" font-size="30">1</text>
    <text x="360" y="348" font-size="22">Even number of 1s</text>
    <text x="360" y="378" font-size="20">Accepting state</text>
    <text x="820" y="348" font-size="22">Odd number of 1s</text>
  </g>
  <g fill="white" stroke="#182129" stroke-width="3">
    <circle cx="360" cy="240" r="62"/>
    <circle cx="360" cy="240" r="53"/>
    <circle cx="820" cy="240" r="62"/>
  </g>
  <g fill="none" stroke="#182129" stroke-width="2.6" marker-end="url(#arrow)">
    <path d="M 125 240 L 296 240"/>
    <path d="M 325 187 C 250 73 470 73 395 187"/>
    <path d="M 785 187 C 710 73 930 73 855 187"/>
    <path d="M 411 202 C 510 130 670 130 769 202"/>
    <path d="M 769 278 C 670 350 510 350 411 278"/>
  </g>
  <g fill="#182129" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="middle">
    <text x="360" y="249">q_even</text>
    <text x="820" y="249">q_odd</text>
  </g>
</svg>
