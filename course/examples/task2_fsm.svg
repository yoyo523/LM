<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Task 2: production rules to a finite state machine</title>
  <desc id="desc">A complete DFA for S to aA or bB; A to aS or b; B to bS or a. S is initial. F is the only accepting state. D is a dead state. The language is zero or more aa or bb pairs followed by ab or ba.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#182129" stroke-width="1.3"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #182129; }
      .edge path, .start { fill: none; stroke: #182129; stroke-width: 2.6; marker-end: url(#arrow); }
      .edge text { font-size: 27px; }
      .state { fill: white; stroke: #182129; stroke-width: 3; }
      .name { font-size: 32px; }
    </style>
  </defs>
  <rect width="1180" height="650" fill="white"/>
  <text x="590" y="40" font-size="28">Task 2 - Production Rules to FSM</text>
  <text x="590" y="73" font-size="20">Alphabet: {a, b} | Start: S | Accepting: F</text>

  <circle class="state" data-state="S" data-initial="true" cx="155" cy="330" r="55"/>
  <circle class="state" data-state="A" cx="450" cy="170" r="55"/>
  <circle class="state" data-state="B" cx="450" cy="490" r="55"/>
  <circle class="state" data-state="F" data-accepting="true" cx="760" cy="330" r="55"/>
  <circle class="state" cx="760" cy="330" r="46"/>
  <circle class="state" data-state="D" cx="1020" cy="330" r="55"/>
  <path class="start" d="M 25 330 L 98 330"/>
  <text x="55" y="311" font-size="19">start</text>

  <g class="edge" data-from="S" data-to="A" data-symbols="a">
    <path d="M 155 274 C 175 142 303 121 398 147"/>
    <text x="265" y="126">a</text>
  </g>
  <g class="edge" data-from="A" data-to="S" data-symbols="a">
    <path d="M 410 208 C 335 283 270 322 211 330"/>
    <text x="330" y="319">a</text>
  </g>
  <g class="edge" data-from="S" data-to="B" data-symbols="b">
    <path d="M 202 360 C 294 365 349 407 411 450"/>
    <text x="315" y="373">b</text>
  </g>
  <g class="edge" data-from="B" data-to="S" data-symbols="b">
    <path d="M 398 512 C 275 560 184 498 155 386"/>
    <text x="270" y="560">b</text>
  </g>
  <g class="edge" data-from="A" data-to="F" data-symbols="b">
    <path d="M 500 194 C 580 230 641 279 710 305"/>
    <text x="608" y="233">b</text>
  </g>
  <g class="edge" data-from="B" data-to="F" data-symbols="a">
    <path d="M 500 466 C 580 430 641 381 710 355"/>
    <text x="608" y="443">a</text>
  </g>
  <g class="edge" data-from="F" data-to="D" data-symbols="a,b">
    <path d="M 817 330 L 963 330"/>
    <text x="890" y="309">a, b</text>
  </g>
  <g class="edge" data-from="D" data-to="D" data-symbols="a,b">
    <path d="M 989 284 C 920 170 1120 170 1051 284"/>
    <text x="1020" y="185">a, b</text>
  </g>

  <text class="name" x="155" y="341">S</text>
  <text class="name" x="450" y="181">A</text>
  <text class="name" x="450" y="501">B</text>
  <text class="name" x="760" y="341">F</text>
  <text class="name" x="1020" y="341">D</text>
  <text x="760" y="421" font-size="20">Accepting state</text>
  <text x="1020" y="421" font-size="20">Dead state</text>
  <text x="590" y="624" font-size="20">Accept only when the entire input has been read and the current state is F.</text>
</svg>
